font-weight="400" text-anchor="middle">.vpaint asset</text><text x="36" y="184" font-size="12" fill="#848383" font-weight="400" text-anchor="start">One RGBA image, up to 256 px, per UI Vectoria artboard.</text><rect x="450" y="50" width="410" height="160" rx="6" fill="#fafafa" stroke="#e5e5e5" stroke-width="1.5"/><text x="466" y="76" font-size="14" fill="#111111" font-weight="700" text-anchor="start">At runtime</text><rect x="470" y="100" width="110" height="48" rx="4" fill="#d8f2fc" stroke="#09b1ec" stroke-width="2"/><text x="525" y="120" font-size="12" fill="#111111" font-weight="400" text-anchor="middle">tile in</text><text x="525" y="134" font-size="12" fill="#111111" font-weight="400" text-anchor="middle">the asset</text><line x1="584" y1="124" x2="619.0" y2="124.0" stroke="#848383" stroke-width="2"/><polygon points="628,124 619.0,119.0 619.0,129.0" fill="#848383"/><rect x="632" y="100" width="110" height="48" rx="4" fill="#09b1ec" stroke="#09b1ec" stroke-width="0"/><text x="687" y="120" font-size="12" fill="#fff" font-weight="400" text-anchor="middle">shared</text><text x="687" y="134" font-size="12" fill="#fff" font-weight="400" text-anchor="middle">atlas</text><line x1="746" y1="124" x2="771.0" y2="124.0" stroke="#848383" stroke-width="2"/><polygon points="780,124 771.0,119.0 771.0,129.0" fill="#848383"/><rect x="784" y="100" width="48" height="48" rx="10.56" fill="url(#g)"/><circle cx="808.0" cy="124.0" r="19.200000000000003" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="1.6800000000000002" stroke-dasharray="24.0 10.56"/><polygon points="808.0,109.6 811.6,119.1 821.7,119.6 813.8,125.9 816.5,135.6 808.0,130.0 799.5,135.6 802.2,125.9 794.3,119.6 804.4,119.1" fill="#ffffff"/><circle cx="808.0" cy="124.0" r="3.3600000000000003" fill="#ffb300"/><text x="466" y="184" font-size="12" fill="#848383" font-weight="400" text-anchor="start">Copied into the atlas a few per frame; every raster icon</text><text x="466" y="199" font-size="12" fill="#848383" font-weight="400" text-anchor="start">then batches into one draw call.</text><rect x="20" y="230" width="840" height="60" rx="6" fill="#ffffff" stroke="#09b1ec" stroke-width="2"/><text x="40" y="256" font-size="13" fill="#111111" font-weight="700" text-anchor="start">Drawn from the tile when the icon is at or below the Raster size (default 64 px).</text><text x="40" y="276" font-size="13" fill="#848383" font-weight="400" text-anchor="start">Above that size, or while it animates, the vector shader draws.</text></svg>
