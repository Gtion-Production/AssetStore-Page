<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 356" width="880" height="356" font-family="Noto Sans, Segoe UI, Arial, sans-serif"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b7bd4"/><stop offset="1" stop-color="#05ccff"/></linearGradient></defs><rect width="880" height="356" fill="#ffffff"/><text x="20" y="30" font-size="15" fill="#111111" font-weight="700" text-anchor="start">Shader work per pixel (units)</text><rect x="40.0" y="80" width="100.0" height="46" fill="#e7f7ee" stroke="#4cc38a" stroke-width="1.5"/><text x="90.0" y="108" font-size="13" fill="#111111" font-weight="700" text-anchor="middle">Cheap</text><rect x="140.0" y="80" width="100.0" height="46" fill="#fff4d6" stroke="#e6c74c" stroke-width="1.5"/><text x="190.0" y="108" font-size="13" fill="#111111" font-weight="700" text-anchor="middle">Moderate</text><rect x="240.0" y="80" width="466.66666666666674" height="46" fill="#ffe3cf" stroke="#f08c3c" stroke-width="1.5"/><text x="473.33333333333337" y="108" font-size="13" fill="#111111" font-weight="700" text-anchor="middle">Heavy</text><rect x="706.6666666666667" y="80" width="133.33333333333326" height="46" fill="#ffd9d6" stroke="#e65450" stroke-width="1.5"/><text x="773.3333333333334" y="108" font-size="13" fill="#111111" font-weight="700" text-anchor="middle">Very heavy</text><text x="40.0" y="148" font-size="12" fill="#848383" font-weight="700" text-anchor="middle">0</text><text x="140.0" y="148" font-size="12" fill="#848383" font-weight="700" text-anchor="middle">15</text><text x="240.0" y="148" font-size="12" fill="#848383" font-weight="700" text-anchor="middle">30</text><text x="706.6666666666667" y="148" font-size="12" fill="#848383" font-weight="700" text-anchor="middle">100</text><line x1="140.0" y1="52" x2="140.0" y2="132" stroke="#09b1ec" stroke-width="3"/><text x="148.0" y="68" font-size="12" fill="#09b1ec" font-weight="700" text-anchor="start">Complex Image Only bakes from here (default 15)</text><circle cx="93.33333333333334" cy="176" r="6" fill="#111111"/><text x="93.33333333333334" y="202" font-size="12" fill="#111111" font-weight="700" text-anchor="middle">Flat bar</text><text x="93.33333333333334" y="217" font-size="12" fill="#848383" font-weight="400" text-anchor="middle">8 units</text><circle cx="173.33333333333331" cy="176" r="6" fill="#111111"/><text x="173.33333333333331" y="202" font-size="12" fill="#111111" font-weight="700" text-anchor="middle">Star icon</text><text x="173.33333333333331" y="217" font-size="12" fill="#848383" font-weight="400" text-anchor="middle">20 units</text><circle cx="260.0" cy="176" r="6" fill="#111111"/><text x="260.0" y="202" font-size="12" fill="#111111" font-weight="700" text-anchor="middle">Detailed</text><text x="260.0" y="217" font-size="12" fill="#111111" font-weight="700" text-anchor="middle">illustration</text><text x="260.0" y="232" font-size="12" fill="#848383" font-weight="400" text-anchor="middle">33 units</text><rect x="20" y="250" width="840" height="86" rx="6" fill="#fafafa" stroke="#e5e5e5" stroke-width="1.5"/><text x="40" y="276" font-size="13" fill="#111111" font-weight="700" text-anchor="start">What a unit is</text><text x="40" y="296" font-size="13" fill="#848383" font-weight="400" text-anchor="start">Outline segments the shader checks per pixel (area weighted), plus 8 for each gradient.</text><text x="40" y="315" font-size="13" fill="#848383" font-weight="400" text-anchor="start">It does not depend on the GPU or on the drawn size, so the same minimum works everywhere.</text></svg>
