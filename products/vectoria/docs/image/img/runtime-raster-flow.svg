<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 474" width="880" height="474" font-family="Noto Sans, Segoe UI, Arial, sans-serif"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b7bd4"/><stop offset="1" stop-color="#05ccff"/></linearGradient></defs><rect width="880" height="474" fill="#ffffff"/><rect x="20" y="20" width="260" height="360" rx="6" fill="#fafafa" stroke="#e5e5e5" stroke-width="1.5"/><text x="40" y="50" font-size="15" fill="#111111" font-weight="700" text-anchor="start">Frame 1</text><text x="40" y="70" font-size="12" fill="#848383" font-weight="400" text-anchor="start">The icon appears</text><rect x="310" y="20" width="260" height="360" rx="6" fill="#fafafa" stroke="#e5e5e5" stroke-width="1.5"/><text x="330" y="50" font-size="15" fill="#111111" font-weight="700" text-anchor="start">Same frame</text><text x="330" y="70" font-size="12" fill="#848383" font-weight="400" text-anchor="start">The bake</text><rect x="600" y="20" width="260" height="360" rx="6" fill="#ffffff" stroke="#09b1ec" stroke-width="2"/><text x="620" y="50" font-size="15" fill="#111111" font-weight="700" text-anchor="start">Every later frame</text><text x="620" y="70" font-size="12" fill="#848383" font-weight="400" text-anchor="start">Drawn from the atlas</text><rect x="60" y="100" width="90" height="90" rx="19.8" fill="url(#g)"/><circle cx="105.0" cy="145.0" r="36.0" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="3.1500000000000004" stroke-dasharray="45.0 19.8"/><polygon points="105.0,118.0 111.7,135.8 130.7,136.7 115.8,148.5 120.9,166.8 105.0,156.3 89.1,166.8 94.2,148.5 79.3,136.7 98.3,135.8" fill="#ffffff"/><circle cx="105.0" cy="145.0" r="6.300000000000001" fill="#ffb300"/><rect x="170" y="110" width="90" height="70" fill="#fff" stroke="#848383" stroke-width="1.5" stroke-dasharray="5 3" rx="4"/><text x="215" y="142" font-size="12" fill="#848383" font-weight="400" text-anchor="middle">frame</text><text x="215" y="157" font-size="12" fill="#848383" font-weight="400" text-anchor="middle">quota</text><text x="40" y="240" font-size="13" fill="#848383" font-weight="400" text-anchor="start">The icon asks for a tile. Inside</text><text x="40" y="258" font-size="13" fill="#848383" font-weight="400" text-anchor="start">the frame's quota it is baked now,</text><text x="40" y="276" font-size="13" fill="#848383" font-weight="400" text-anchor="start">before it is drawn.</text><rect x="40" y="320" width="200" height="22" fill="#ff9f1a" rx="3"/><text x="40" y="360" font-size="12" fill="#111111" font-weight="700" text-anchor="start">GPU: nothing drawn yet</text><rect x="330" y="100" width="100" height="90" rx="6" fill="#ffffff" stroke="#848383" stroke-width="1.5"/><text x="380" y="138" font-size="12" fill="#848383" font-weight="400" text-anchor="middle">offscreen</text><text x="380" y="153" font-size="12" fill="#848383" font-weight="400" text-anchor="middle">render</text><line x1="432" y1="145" x2="459.0" y2="145.0" stroke="#848383" stroke-width="2"/><polygon points="468,145 459.0,140.0 459.0,150.0" fill="#848383"/><rect x="468" y="100" width="92" height="90" rx="4" fill="#d8f2fc" stroke="#09b1ec" stroke-width="2"/><text x="514" y="138" font-size="12" fill="#111111" font-weight="400" text-anchor="middle">atlas</text><text x="514" y="153" font-size="12" fill="#111111" font-weight="400" text-anchor="middle">cell + mips</text><text x="330" y="240" font-size="13" fill="#848383" font-weight="400" text-anchor="start">The artwork is rendered once,</text><text x="330" y="258" font-size="13" fill="#848383" font-weight="400" text-anchor="start">at its size, into a free cell of</text><text x="330" y="276" font-size="13" fill="#848383" font-weight="400" text-anchor="start">the shared atlas (3 mip levels).</text><rect x="330" y="320" width="200" height="22" fill="#ff9f1a" rx="3"/><text x="330" y="360" font-size="12" fill="#111111" font-weight="700" text-anchor="start">once: about one shader draw</text><rect x="640" y="100" width="90" height="90" rx="19.8" fill="url(#g)"/><circle cx="685.0" cy="145.0" r="36.0" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="3.1500000000000004" stroke-dasharray="45.0 19.8"/><polygon points="685.0,118.0 691.7,135.8 710.7,136.7 695.8,148.5 700.9,166.8 685.0,156.3 669.1,166.8 674.2,148.5 659.3,136.7 678.3,135.8" fill="#ffffff"/><circle cx="685.0" cy="145.0" r="6.300000000000001" fill="#ffb300"/><rect x="740" y="120" width="90" height="50" fill="#d8f2fc" stroke="#09b1ec" stroke-width="1.5" rx="4"/><text x="785" y="140" font-size="12" fill="#111111" font-weight="400" text-anchor="middle">one</text><text x="785" y="155" font-size="12" fill="#111111" font-weight="400" text-anchor="middle">texture read</text><text x="620" y="240" font-size="13" fill="#848383" font-weight="400" text-anchor="start">A plain textured quad. The shader</text><text x="620" y="258" font-size="13" fill="#848383" font-weight="400" text-anchor="start">no longer walks the outlines for</text><text x="620" y="276" font-size="13" fill="#848383" font-weight="400" text-anchor="start">every pixel.</text><rect x="620" y="320" width="40" height="22" fill="#09b1ec" rx="3"/><text x="620" y="360" font-size="12" fill="#111111" font-weight="700" text-anchor="start">GPU: texture read</text><rect x="20" y="392" width="840" height="70" rx="6" fill="#ffffff" stroke="#09b1ec" stroke-width="2"/><text x="40" y="414" font-size="14" fill="#111111" font-weight="700" text-anchor="start">Measured: 16 heavy icons at 1400 px (GPU time per frame)</text><text x="40" y="434" font-size="13" fill="#848383" font-weight="400" text-anchor="start">10.7 ms per frame with the shader, 1.1 ms from the atlas.</text><text x="40" y="451" font-size="13" fill="#848383" font-weight="400" text-anchor="start">Play mode, FrameTimingManager, RTX 3060 laptop.</text></svg>
