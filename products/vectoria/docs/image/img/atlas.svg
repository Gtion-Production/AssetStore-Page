<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 522" width="880" height="522" font-family="Noto Sans, Segoe UI, Arial, sans-serif"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b7bd4"/><stop offset="1" stop-color="#05ccff"/></linearGradient></defs><rect width="880" height="522" fill="#ffffff"/><text x="20" y="30" font-size="15" fill="#111111" font-weight="700" text-anchor="start">The raster atlas</text><rect x="20" y="50" width="340" height="340" fill="#f6f6f6" stroke="#111111" stroke-width="2"/><rect x="24" y="52" width="127" height="127" fill="#d8f2fc" stroke="#09b1ec" stroke-width="1"/><rect x="154" y="52" width="97" height="127" fill="#d8f2fc" stroke="#09b1ec" stroke-width="1"/><rect x="254" y="52" width="92" height="127" fill="#d8f2fc" stroke="#09b1ec" stroke-width="1"/><rect x="24" y="186" width="97" height="97" fill="#d8f2fc" stroke="#09b1ec" stroke-width="1"/><rect x="124" y="186" width="97" height="97" fill="#d8f2fc" stroke="#09b1ec" stroke-width="1"/><rect x="224" y="186" width="97" height="97" fill="#d8f2fc" stroke="#09b1ec" stroke-width="1"/><rect x="24" y="290" width="57" height="57" fill="#d8f2fc" stroke="#09b1ec" stroke-width="1"/><rect x="84" y="290" width="57" height="57" fill="#d8f2fc" stroke="#09b1ec" stroke-width="1"/><rect x="144" y="290" width="57" height="57" fill="#d8f2fc" stroke="#09b1ec" stroke-width="1"/><rect x="204" y="290" width="57" height="57" fill="#d8f2fc" stroke="#09b1ec" stroke-width="1"/><rect x="264" y="290" width="57" height="57" fill="#d8f2fc" stroke="#09b1ec" stroke-width="1"/><rect x="24" y="354" width="33" height="33" fill="#d8f2fc" stroke="#09b1ec" stroke-width="1"/><rect x="60" y="354" width="33" height="33" fill="#d8f2fc" stroke="#09b1ec" stroke-width="1"/><rect x="96" y="354" width="33" height="33" fill="#d8f2fc" stroke="#09b1ec" stroke-width="1"/><rect x="132" y="354" width="33" height="33" fill="#d8f2fc" stroke="#09b1ec" stroke-width="1"/><rect x="168" y="354" width="33" height="33" fill="#d8f2fc" stroke="#09b1ec" stroke-width="1"/><rect x="204" y="354" width="33" height="33" fill="#d8f2fc" stroke="#09b1ec" stroke-width="1"/><rect x="240" y="354" width="33" height="33" fill="#d8f2fc" stroke="#09b1ec" stroke-width="1"/><rect x="276" y="354" width="33" height="33" fill="#d8f2fc" stroke="#09b1ec" stroke-width="1"/><text x="190.0" y="414" font-size="12" fill="#848383" font-weight="400" text-anchor="middle">One page (a slice of a texture array)</text><line x1="90" y1="110" x2="411.0041293876916" y2="100.27260213976692" stroke="#09b1ec" stroke-width="1.5"/><polygon points="420,100 410.85268375448777,95.27489624404001 411.1555750208954,105.27030803549383" fill="#09b1ec"/><rect x="430" y="60" width="190" height="190" fill="#fff" stroke="#848383" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="444" y="74" width="162" height="162" rx="18" fill="url(#g)"/><circle cx="525.0" cy="155.0" r="64.8" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="5.670000000000001" stroke-dasharray="81.0 35.64"/><polygon points="525.0,106.4 537.0,138.5 571.2,140.0 544.4,161.3 553.6,194.3 525.0,175.4 496.4,194.3 505.6,161.3 478.8,140.0 513.0,138.5" fill="#ffffff"/><circle cx="525.0" cy="155.0" r="11.340000000000002" fill="#ffb300"/><text x="525.0" y="270" font-size="12" fill="#111111" font-weight="700" text-anchor="middle">Tile with a 4 px gutter</text><text x="525.0" y="288" font-size="12" fill="#848383" font-weight="400" text-anchor="middle">repeats its edge so filtering</text><text x="525.0" y="304" font-size="12" fill="#848383" font-weight="400" text-anchor="middle">never reads a neighbour</text><text x="670" y="70" font-size="13" fill="#111111" font-weight="700" text-anchor="start">Mip levels</text><rect x="670" y="85" width="120" height="120" rx="26.4" fill="url(#g)"/><circle cx="730.0" cy="145.0" r="48.0" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="4.2" stroke-dasharray="60.0 26.4"/><polygon points="730.0,109.0 738.9,132.8 764.2,133.9 744.4,149.7 751.2,174.1 730.0,160.1 708.8,174.1 715.6,149.7 695.8,133.9 721.1,132.8" fill="#ffffff"/><circle cx="730.0" cy="145.0" r="8.4" fill="#ffb300"/><text x="802" y="149.0" font-size="12" fill="#848383" font-weight="400" text-anchor="start">full size</text><rect x="670" y="219" width="60" height="60" rx="13.2" fill="url(#g)"/><circle cx="700.0" cy="249.0" r="24.0" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="2.1" stroke-dasharray="30.0 13.2"/><polygon points="700.0,231.0 704.4,242.9 717.1,243.4 707.2,251.3 710.6,263.6 700.0,256.6 689.4,263.6 692.8,251.3 682.9,243.4 695.6,242.9" fill="#ffffff"/><circle cx="700.0" cy="249.0" r="4.2" fill="#ffb300"/><text x="742" y="253.0" font-size="12" fill="#848383" font-weight="400" text-anchor="start">1/2</text><rect x="670" y="293" width="30" height="30" rx="6.6" fill="url(#g)"/><circle cx="685.0" cy="308.0" r="12.0" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="1.05" stroke-dasharray="15.0 6.6"/><polygon points="685.0,299.0 687.2,304.9 693.6,305.2 688.6,309.2 690.3,315.3 685.0,311.8 679.7,315.3 681.4,309.2 676.4,305.2 682.8,304.9" fill="#ffffff"/><circle cx="685.0" cy="308.0" r="2.1" fill="#ffb300"/><text x="712" y="312.0" font-size="12" fill="#848383" font-weight="400" text-anchor="start">1/4</text><text x="670" y="352" font-size="12" fill="#848383" font-weight="400" text-anchor="start">Shown smaller than baked?</text><text x="670" y="368" font-size="12" fill="#848383" font-weight="400" text-anchor="start">A lower level is sampled,</text><text x="670" y="384" font-size="12" fill="#848383" font-weight="400" text-anchor="start">so it stays clean.</text><rect x="20" y="430" width="840" height="72" rx="6" fill="#fafafa" stroke="#e5e5e5" stroke-width="1.5"/><text x="40" y="456" font-size="13" fill="#111111" font-weight="700" text-anchor="start">Memory (mips included)</text><text x="40" y="478" font-size="13" fill="#848383" font-weight="400" text-anchor="start">1024 px page: about 5.6 MB.   2048 px page: about 22 MB.   At most 4 pages on desktop, 2 on mobile.</text><text x="40" y="496" font-size="13" fill="#848383" font-weight="400" text-anchor="start">When the atlas is full, the shader keeps drawing.</text></svg>
